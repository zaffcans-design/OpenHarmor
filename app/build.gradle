plugins { id 'com.android.application' }

android {
    namespace 'com.openharmor.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openharmor.app'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O2' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
}
